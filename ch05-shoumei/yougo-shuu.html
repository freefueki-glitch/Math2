<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>用語集(定義・性質) - 第5章 図形の性質と証明</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --board: #16241b;
  --board2: #1e3226;
  --chalk: #f2f0e6;
  --chalk-dim: #a9b8a4;
  --yellow: #f4d35e;
  --orange: #f4976c;
  --rule: rgba(242,240,230,0.18);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; min-height:100%;
  background: radial-gradient(ellipse at 50% 0%, var(--board2), var(--board) 70%);
  color: var(--chalk);
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.wrap{ max-width: 840px; margin: 0 auto; padding: 6vh 6vw 12vh; }
.top{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom: 2.2em; }
.eyebrow{ font-size: .9rem; letter-spacing:.25em; color: var(--chalk-dim); text-transform:uppercase; margin-bottom:.6em; }
h1.disp{
  font-family:'Yomogi', sans-serif; font-weight:400; color: var(--chalk);
  margin:0; font-size: clamp(1.9rem, 5vw, 2.8rem); letter-spacing:.02em;
}
.subtitle{ font-size: clamp(.95rem,1.8vw,1.1rem); color: var(--chalk-dim); margin-top:.5em; }
.toolbar{ display:flex; gap:.7em; margin-top:1.4em; flex-wrap:wrap; justify-content:center; }
.toolbar button{
  font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:.9rem;
  padding:.55em 1.2em; border-radius:999px; border:1.5px solid var(--chalk-dim);
  background:transparent; color:var(--chalk); cursor:pointer; transition: all .2s ease;
}
.toolbar button:hover{ border-color: var(--yellow); color: var(--yellow); }
.backnav{ display:flex; gap:.6em; margin-bottom:1.6em; }
.backnav a{
  font-size:.8rem; padding:.4em .9em; border-radius:999px;
  border:1px solid var(--chalk-dim); color:var(--chalk-dim); text-decoration:none;
  transition: all .2s ease;
}
.backnav a:hover{ border-color:var(--yellow); color:var(--yellow); }

.part-title{
  font-family:'Yomogi',sans-serif; font-size:1.3rem; color:var(--chalk-dim);
  margin: 1.6em 0 .8em; text-align:center; border-top:1px dashed var(--rule); padding-top:1em;
}
.part-title:first-of-type{ border-top:none; padding-top:0; margin-top:0; }

.box{
  border: 1.5px solid var(--rule); border-radius: 10px;
  padding: 1.1em 1.4em 1.3em; margin-bottom: 1.1em;
}
.box.thick{ border-color: var(--chalk-dim); border-width: 2px; }
.label{
  display:inline-block; font-size:.92rem; font-weight:700;
  border:1px solid var(--chalk-dim); border-radius:6px;
  padding:.15em .8em; margin-bottom:.8em; color: var(--chalk);
}
.line{ font-size: clamp(1rem,1.9vw,1.15rem); line-height:2.1; margin:.3em 0; }
.line.center{ text-align:center; }
.big .line{ font-size: clamp(1.3rem,2.6vw,1.7rem); text-align:center; margin: .3em 0 .1em; }

.blank{
  display:inline-block; border:1.5px solid var(--yellow); border-radius:6px;
  padding: .05em .7em; margin: 0 .1em; cursor:pointer; color: transparent;
  background: rgba(244,211,94,0.06); transition: all .15s ease; user-select:none;
}
.blank.wide{ min-width: 9em; text-align:center; }
.blank:hover{ background: rgba(244,211,94,0.16); }
.blank.revealed{ color: var(--orange); font-weight:700; background: none; border-color: rgba(244,151,108,0.55); cursor: pointer; }

footer{ text-align:center; color: var(--chalk-dim); font-size:.85rem; margin-top: 2em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="backnav">
    <a href="../index.html">← 単元一覧</a>
    <a href="index.html">← 時間選択</a>
  </div>
  <div class="top">
    <div class="eyebrow">中学2年 数学 ／ 第5章 図形の性質と証明</div>
    <h1 class="disp">用語集（定義・性質）</h1>
    <div class="subtitle">四角い枠をクリックすると答えが表示されます</div>
    <div class="toolbar">
      <button id="showAll">すべて表示</button>
      <button id="hideAll">すべて隠す</button>
    </div>
  </div>

  <div id="sections"></div>

  <footer>クリックした枠はもう一度クリックすると隠せます</footer>
</div>

<script>
const sections = [
  { part:'Part1　二等辺三角形・正三角形', title:'二等辺三角形（定義）', big:true,
    lines:[
    [{t:'2つの辺が等しい', blank:true},{t:'三角形を二等辺三角形という'}]
  ]},
  { title:'二等辺三角形の辺や角',
    lines:[
    [{t:'AB＝ACである二等辺三角形ABCで、'}],
    [{t:'等しい辺のつくる角∠Aを　'},{t:'頂角', blank:true}],
    [{t:'頂角に対する辺BCを　'},{t:'底辺', blank:true}],
    [{t:'底辺の両端の角∠Bと∠Cを　'},{t:'底角', blank:true},{t:'　という。'}]
  ]},
  { title:'二等辺三角形の底角', big:true,
    lines:[
    [{t:'二等辺三角形の'},{t:'2つの底角は等しい', blank:true}]
  ]},
  { title:'二等辺三角形の頂角の二等分線', big:true,
    lines:[
    [{t:'二等辺三角形の頂角の二等分線は、'}],
    [{t:'底辺を垂直に2等分する。', blank:true, wide:true}]
  ]},
  { title:'正三角形の定義', big:true,
    lines:[
    [{t:'3つの辺がすべて等しい', blank:true},{t:'三角形を、正三角形という。'}]
  ]},
  { part:'Part1　直角三角形・平行四辺形', title:'斜辺',
    lines:[
    [{t:'直角三角形で、直角に対する辺を'},{t:'斜辺', blank:true},{t:'という。'}]
  ]},
  { title:'直角三角形の合同条件', thick:true,
    lines:[
    [{t:'2つの直角三角形は、次のそれぞれの場合に合同である。'}],
    [{t:'①　'},{t:'斜辺と1つの鋭角', blank:true},{t:'が、それぞれ等しいとき'}],
    [{t:'②　'},{t:'斜辺と他の1辺', blank:true},{t:'が、それぞれ等しいとき'}]
  ]},
  { title:'平行四辺形（定義）',
    lines:[
    [{t:'2組の向かいあう辺が、それぞれ平行な四角形', blank:true},{t:'を'}],
    [{t:'平行四辺形という。'}]
  ]},
  { title:'平行四辺形の性質', thick:true,
    lines:[
    [{t:'①　平行四辺形の'}],
    [{t:'2組の向かいあう辺は、それぞれ等しい。', blank:true}],
    [{t:'②　平行四辺形の'}],
    [{t:'2組の向かいあう角は、それぞれ等しい。', blank:true}],
    [{t:'③　平行四辺形の'}],
    [{t:'対角線は、それぞれの中点で交わる。', blank:true}]
  ]},
  { part:'Part2　平行四辺形になるための条件・四角形', title:'平行四辺形になるための条件', thick:true,
    lines:[
    [{t:'①　'},{t:'2組の向かいあう辺が、それぞれ平行であるとき（定義）', blank:true}],
    [{t:'②　'},{t:'2組の向かいあう辺が、それぞれ等しいとき', blank:true}],
    [{t:'③　'},{t:'2組の向かいあう角が、それぞれ等しいとき。', blank:true}],
    [{t:'④　'},{t:'対角線が、それぞれの中点で交わるとき', blank:true}],
    [{t:'⑤　'},{t:'1組の向かいあう辺が、等しくて平行であるとき', blank:true}]
  ]},
  { title:'四角形の定義',
    lines:[
    [{t:'○　'},{t:'4つの角がすべて等しい', blank:true},{t:'四角形を、長方形という'}],
    [{t:'○　'},{t:'4つの辺がすべて等しい', blank:true},{t:'四角形を、ひし形という'}],
    [{t:'○　'},{t:'4つの辺がすべて等しく、4つの角がすべて等しい', blank:true},{t:'四角形を、正方形という'}]
  ]},
  { title:'四角形の対角線の性質',
    lines:[
    [{t:'○　長方形の対角線は、'},{t:'長さが等しい。', blank:true}],
    [{t:'○　ひし形の対角線は、'},{t:'垂直に交わる。', blank:true}],
    [{t:'○　正方形の対角線は、'},{t:'長さが等しく、垂直に交わる。', blank:true}]
  ]}
];

const wrap = document.getElementById('sections');
sections.forEach(sec=>{
  if(sec.part){
    const pt = document.createElement('div');
    pt.className = 'part-title';
    pt.textContent = sec.part;
    wrap.appendChild(pt);
  }
  const box = document.createElement('div');
  box.className = 'box' + (sec.thick?' thick':'') + (sec.big?' big':'');
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = sec.title;
  box.appendChild(label);

  sec.lines.forEach(segs=>{
    const p = document.createElement('div');
    p.className = 'line' + (sec.big?' center':'');
    segs.forEach(seg=>{
      if(seg.blank){
        const s = document.createElement('span');
        s.className = 'blank' + (seg.wide?' wide':'');
        s.textContent = seg.t;
        s.addEventListener('click', ()=> s.classList.toggle('revealed'));
        p.appendChild(s);
      } else {
        p.appendChild(document.createTextNode(seg.t));
      }
    });
    box.appendChild(p);
  });
  wrap.appendChild(box);
});

document.getElementById('showAll').addEventListener('click', ()=>{
  document.querySelectorAll('.blank').forEach(b=>b.classList.add('revealed'));
});
document.getElementById('hideAll').addEventListener('click', ()=>{
  document.querySelectorAll('.blank').forEach(b=>b.classList.remove('revealed'));
});
</script>
</body>
</html>
