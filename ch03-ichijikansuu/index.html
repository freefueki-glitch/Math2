<style>
:root{
  --board: #16241b;
  --board2: #1e3226;
  --chalk: #f2f0e6;
  --chalk-dim: #a9b8a4;
  --yellow: #f4d35e;
  --rule: rgba(242,240,230,0.18);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; min-height:100%;
  background: radial-gradient(ellipse at 50% 0%, var(--board2), var(--board) 70%);
  color: var(--chalk);
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.wrap{
  max-width: 760px; margin: 0 auto;
  padding: 8vh 6vw 10vh;
  display:flex; flex-direction:column; align-items:center;
}
.eyebrow{ font-size: .95rem; letter-spacing:.25em; color: var(--chalk-dim); text-transform:uppercase; margin-bottom:.6em; }
h1.disp{
  font-family:'Yomogi', sans-serif; font-weight:400; color: var(--chalk);
  margin:0; font-size: clamp(2.2rem, 6vw, 3.4rem); text-align:center; letter-spacing:.02em;
}
.subtitle{ font-size: clamp(1rem,2vw,1.2rem); color: var(--chalk-dim); margin-top:.5em; }
.divider{
  width:120px; height:2px; margin:1.6em auto 2.4em;
  background: repeating-linear-gradient(90deg, var(--chalk-dim) 0 10px, transparent 10px 16px);
  opacity:.6;
}
.list{ width:100%; display:flex; flex-direction:column; gap: .9em; }
.item{
  display:flex; align-items:center; gap: 1.1em;
  padding: 1em 1.3em; border-radius: 14px;
  border: 1.5px solid var(--rule);
  text-decoration:none; color: var(--chalk);
  transition: all .2s ease;
}
a.item:hover{ border-color: var(--yellow); background: rgba(244,211,94,0.06); transform: translateX(4px); }
.item.disabled{ opacity:.45; }
.hour{
  font-family:'Yomogi',sans-serif; font-size:1.1rem; color: var(--yellow);
  flex-shrink:0; width:6.4em;
}
.item.disabled .hour{ color: var(--chalk-dim); }
.title{ font-size: clamp(1rem,2vw,1.2rem); font-weight:700; flex-grow:1; }
.item.disabled .title{ font-weight:400; }
.badge{
  font-size:.78rem; padding:.25em .8em; border-radius:999px;
  border:1px solid var(--chalk-dim); color: var(--chalk-dim); flex-shrink:0;
}
.arrow{ color: var(--yellow); font-size:1.3rem; flex-shrink:0; }
.item.disabled .arrow{ visibility:hidden; }
.backnav{ display:flex; gap:.6em; margin-bottom:1.6em; }
.backnav a{
  font-size:.8rem; padding:.4em .9em; border-radius:999px;
  border:1px solid var(--chalk-dim); color:var(--chalk-dim); text-decoration:none;
  transition: all .2s ease;
}
.backnav a:hover{ border-color:var(--yellow); color:var(--yellow); }
.resources{ width:100%; margin-top:2.4em; }
.resources .eyebrow{ margin-bottom:.8em; }
.reslist{ width:100%; display:flex; flex-direction:column; gap:.7em; }
.resitem{
  display:flex; align-items:center; gap:1em;
  padding:.9em 1.2em; border-radius:12px;
  border:1.5px dashed var(--rule);
  text-decoration:none; color:var(--chalk);
  transition: all .2s ease;
}
.resitem:hover{ border-color:var(--yellow); background: rgba(244,211,94,0.06); }
.resitem .icon{ font-size:1.3rem; color:var(--yellow); flex-shrink:0; }
.resitem .rtitle{ font-size:1rem; font-weight:700; flex-grow:1; }
.resitem .rnote{ font-size:.8rem; color:var(--chalk-dim); }
</style>
