<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>用語集(必ず覚える) - 第4章 図形の性質</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --board: #16241b;
  --board2: #1e3226;
  --chalk: #f2f0e6;
  --chalk-dim: #a9b8a4;
  --yellow: #f4d35e;
  --orange: #f4976c;
  --rule: rgba(242,240,230,0.18);
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; min-height:100%;
  background: radial-gradient(ellipse at 50% 0%, var(--board2), var(--board) 70%);
  color: var(--chalk);
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.wrap{ max-width: 840px; margin: 0 auto; padding: 6vh 6vw 12vh; }
.top{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom: 2.2em; }
.eyebrow{ font-size: .9rem; letter-spacing:.25em; color: var(--chalk-dim); text-transform:uppercase; margin-bottom:.6em; }
h1.disp{
  font-family:'Yomogi', sans-serif; font-weight:400; color: var(--chalk);
  margin:0; font-size: clamp(1.9rem, 5vw, 2.8rem); letter-spacing:.02em;
}
.subtitle{ font-size: clamp(.95rem,1.8vw,1.1rem); color: var(--chalk-dim); margin-top:.5em; }
.toolbar{ display:flex; gap:.7em; margin-top:1.4em; flex-wrap:wrap; justify-content:center; }
.toolbar button{
  font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:.9rem;
  padding:.55em 1.2em; border-radius:999px; border:1.5px solid var(--chalk-dim);
  background:transparent; color:var(--chalk); cursor:pointer; transition: all .2s ease;
}
.toolbar button:hover{ border-color: var(--yellow); color: var(--yellow); }

.box{
  border: 1.5px solid var(--rule); border-radius: 10px;
  padding: 1.1em 1.4em 1.3em; margin-bottom: 1.1em;
}
.box.thick{ border-color: var(--chalk-dim); border-width: 2px; }
.label{
  display:inline-block; font-size:.92rem; font-weight:700;
  border:1px solid var(--chalk-dim); border-radius:6px;
  padding:.15em .8em; margin-bottom:.8em; color: var(--chalk);
}
.line{ font-size: clamp(1rem,1.9vw,1.15rem); line-height:2.1; margin:.3em 0; }
.line.center{ text-align:center; }
.big .line{ font-size: clamp(1.3rem,2.6vw,1.7rem); text-align:center; margin: .3em 0 .1em; }

.blank{
  display:inline-block; border:1.5px solid var(--yellow); border-radius:6px;
  padding: .05em .7em; margin: 0 .1em; cursor:pointer; color: transparent;
  background: rgba(244,211,94,0.06); transition: all .15s ease; user-select:none;
}
.blank:hover{ background: rgba(244,211,94,0.16); }
.blank.revealed{ color: var(--orange); font-weight:700; background: none; border-color: rgba(244,151,108,0.55); cursor: pointer; }

footer{ text-align:center; color: var(--chalk-dim); font-size:.85rem; margin-top: 2em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">中学2年 数学 ／ 第4章 図形の性質</div>
    <h1 class="disp">用語集（必ず覚える）</h1>
    <div class="subtitle">四角い枠をクリックすると答えが表示されます</div>
    <div class="toolbar">
      <button id="showAll">すべて表示</button>
      <button id="hideAll">すべて隠す</button>
    </div>
  </div>

  <div id="sections"></div>

  <footer>クリックした枠はもう一度クリックすると隠せます</footer>
</div>

<script>
const sections = [
  { title:'対頂角の性質', big:true, lines:[
    [{t:'対頂角', blank:true},{t:'は等しい'}]
  ]},
  { title:'平行線の性質', lines:[
    [{t:'2つの直線に1つの直線が交わるとき、次のことが成り立つ。'}],
    [{t:'①　2つの直線が平行ならば、'},{t:'同位角は等しい。', blank:true}],
    [{t:'②　2つの直線が平行ならば、'},{t:'錯角は等しい。', blank:true}]
  ]},
  { title:'平行線になるための条件', thick:true, lines:[
    [{t:'2つの直線に1つの直線が交わるとき、次のことが成り立つ。'}],
    [{t:'①　'},{t:'同位角', blank:true},{t:'が等しいならば、この2つの直線は平行である。'}],
    [{t:'②　'},{t:'錯角', blank:true},{t:'が等しいならば、この2つの直線は平行である。'}]
  ]},
  { title:'三角形の内角・外角の性質', lines:[
    [{t:'①　三角形の3つの内角の和は、'},{t:'180°', blank:true},{t:'である。'}],
    [{t:'②　三角形の1つの外角は、'},{t:'そのとなりにない2つの内角の和に等しい。', blank:true}]
  ]},
  { title:'三角形の種類', lines:[
    [{t:'≪'},{t:'鋭角三角形', blank:true},{t:'≫　・・・　3つの内角がすべて鋭角（90°未満）である三角形'}],
    [{t:'≪'},{t:'直角三角形', blank:true},{t:'≫　・・・　1つの内角が直角である三角形'}],
    [{t:'≪'},{t:'鈍角三角形', blank:true},{t:'≫　・・・　1つの内角が鈍角（90°より大きい）である三角形'}]
  ]},
  { title:'多角形（n角形）の内角の和', lines:[
    [{t:'n角形の内角の和は、'},{t:'180×(n−2)', blank:true},{t:'で求められる。'}]
  ]},
  { title:'多角形（n角形）の外角の和', lines:[
    [{t:'多角形の外角の和は、'},{t:'360°', blank:true},{t:'である。'}]
  ]},
  { title:'合同な図形の性質', lines:[
    [{t:'①　合同な図形では、'},{t:'対応する線分の長さは、それぞれ等しい。', blank:true}],
    [{t:'②　合同な図形では、'},{t:'対応する角の大きさは、それぞれ等しい。', blank:true}]
  ]},
  { title:'三角形の合同条件', thick:true, lines:[
    [{t:'2つの三角形は、次のそれぞれの場合に合同である。'}],
    [{t:'①　'},{t:'3組の辺が、', blank:true},{t:'それぞれ等しいとき'}],
    [{t:'②　'},{t:'2組の辺とその間の角が、', blank:true},{t:'それぞれ等しいとき'}],
    [{t:'③　'},{t:'1組の辺とその両端の角が、', blank:true},{t:'それぞれ等しいとき'}]
  ]}
];

const wrap = document.getElementById('sections');
sections.forEach(sec=>{
  const box = document.createElement('div');
  box.className = 'box' + (sec.thick?' thick':'') + (sec.big?' big':'');
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = sec.title;
  box.appendChild(label);
  sec.lines.forEach(segs=>{
    const p = document.createElement('div');
    p.className = 'line' + (sec.big?' center':'');
    segs.forEach(seg=>{
      if(seg.blank){
        const s = document.createElement('span');
        s.className = 'blank';
        s.textContent = seg.t;
        s.addEventListener('click', ()=> s.classList.toggle('revealed'));
        p.appendChild(s);
      } else {
        p.appendChild(document.createTextNode(seg.t));
      }
    });
    box.appendChild(p);
  });
  wrap.appendChild(box);
});

document.getElementById('showAll').addEventListener('click', ()=>{
  document.querySelectorAll('.blank').forEach(b=>b.classList.add('revealed'));
});
document.getElementById('hideAll').addEventListener('click', ()=>{
  document.querySelectorAll('.blank').forEach(b=>b.classList.remove('revealed'));
});
</script>
</body>
</html>
